[package]
name = "cargo-ai-desktop"
version = "0.1.0"
description = "A local-first vault for portable AI connections and memory"
authors = ["Cargo contributors"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "cargo_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
cargo-ai-core = { version = "0.1.0", path = "../../../crates/core" }
chrono.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile.workspace = true
