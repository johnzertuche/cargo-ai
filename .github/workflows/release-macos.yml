name: Production macOS release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed production tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cargo-production-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    name: Verify, sign, and notarize macOS
    runs-on: macos-15
    environment: production-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.0
          cache: false

      - name: Scan the complete signed-tag history for secrets
        run: |
          export GOBIN="$RUNNER_TEMP/cargo-security-bin"
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          "$GOBIN/gitleaks" git --redact --exit-code 1 --no-banner
          fixture="$(mktemp -d)"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$fixture/leak.pem" 2>/dev/null
          set +e
          "$GOBIN/gitleaks" dir "$fixture" --redact --exit-code 1 --no-banner >/dev/null 2>&1
          fixture_result="$?"
          set -e
          test "$fixture_result" = 1 || { echo "gitleaks failed its synthetic detection control" >&2; exit 1; }

      - name: Fail closed when production credentials are unavailable
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_SIGNER_LOGIN: ${{ secrets.RELEASE_SIGNER_LOGIN }}
          RELEASE_SIGNER_FINGERPRINT: ${{ secrets.RELEASE_SIGNER_FINGERPRINT }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_TEAM_ID RELEASE_SIGNER_LOGIN RELEASE_SIGNER_FINGERPRINT; do
            test -n "${!name:-}" || { echo "missing required production secret: $name" >&2; exit 1; }
          done

      - name: Verify signed tag and version agreement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNER_LOGIN: ${{ secrets.RELEASE_SIGNER_LOGIN }}
          RELEASE_SIGNER_FINGERPRINT: ${{ secrets.RELEASE_SIGNER_FINGERPRINT }}
        run: |
          node scripts/release/verify-version.mjs "$RELEASE_TAG"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          test "$object_type" = tag || { echo "production tag must be annotated and signed" >&2; exit 1; }
          tag_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
          verified="$(jq -r '.verification.verified' <<<"$tag_json")"
          test "$verified" = true || { echo "production tag signature is not verified by GitHub" >&2; exit 1; }
          signature="$(jq -r '.verification.signature // empty' <<<"$tag_json")"
          grep -q '^-----BEGIN PGP SIGNATURE-----$' <<<"$signature" || { echo "production tag must use an allowlisted OpenPGP key" >&2; exit 1; }

          export GNUPGHOME="$RUNNER_TEMP/cargo-release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gh api --paginate "users/${RELEASE_SIGNER_LOGIN}/gpg_keys" --jq '.[].raw_key' > "$RUNNER_TEMP/cargo-release-signers.asc"
          test -s "$RUNNER_TEMP/cargo-release-signers.asc" || { echo "allowlisted signer has no public OpenPGP keys on GitHub" >&2; exit 1; }
          gpg --batch --import "$RUNNER_TEMP/cargo-release-signers.asc" >/dev/null 2>&1
          git verify-tag --raw "$RELEASE_TAG" 2>"$RUNNER_TEMP/cargo-tag-verification.log"
          expected_fingerprint="$(tr -d '[:space:]' <<<"$RELEASE_SIGNER_FINGERPRINT" | tr '[:lower:]' '[:upper:]')"
          awk '/^\[GNUPG:\] VALIDSIG / { print toupper($3); print toupper($NF) }' "$RUNNER_TEMP/cargo-tag-verification.log" | grep -Fx -- "$expected_fingerprint" >/dev/null || {
            echo "production tag was not signed by the pinned OpenPGP fingerprint" >&2
            exit 1
          }
          target_type="$(jq -r '.object.type' <<<"$tag_json")"
          target_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          test "$target_type" = commit || { echo "signed tag must directly target a commit" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$target_sha" || { echo "checkout does not match the signed tag commit" >&2; exit 1; }
          printf '%s\n' "$target_sha" > release-commit.txt

      - name: Install and test locked dependencies
        run: |
          npm ci
          npm ci --prefix apps/desktop
          cargo test --workspace --locked
          cargo test -p cargo-ai-core --test clean_device_recovery --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check licenses bans sources
          npm test
          npm test --prefix apps/desktop
          npm run build --prefix apps/desktop
          npm run security:supply-chain
          npm audit --omit=dev
          npm audit --omit=dev --prefix apps/desktop

      - name: Audit both shipped Rust targets
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          for arch in aarch64 x86_64; do
            cargo audit --target-os macos --target-arch "$arch" --deny unsound --ignore RUSTSEC-2024-0429
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/cargo-developer-id.p12"
          keychain_path="$RUNNER_TEMP/cargo-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F -- "$APPLE_SIGNING_IDENTITY"

      - name: Build signed and notarized artifacts
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          chmod 600 "$api_key_path"
          export APPLE_API_KEY_PATH="$api_key_path"
          rustc -Vv
          xcodebuild -version
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            npm run desktop:build -- --target "$target" --bundles app,dmg
          done

      - name: Verify signatures, notarization, Gatekeeper, and disk image
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            app_path="target/${target}/release/bundle/macos/Cargo.app"
            dmg_path="$(find "target/${target}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -n "$dmg_path"
            bash scripts/release/verify-macos-artifacts.sh "$app_path" "$dmg_path" "$APPLE_TEAM_ID"
          done

      - name: Build SBOMs and checksums
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          mkdir -p release-assets
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            arch="${target%%-apple-darwin}"
            cargo cyclonedx --format json --all --target "$target" --target-in-filename
            dmg_path="$(find "target/${target}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -s "$dmg_path"
            cp "$dmg_path" "release-assets/Cargo_${RELEASE_TAG}_${arch}.dmg"
            for spec in \
              "crates/core/cargo-ai-core_${target}.cdx.json:core" \
              "apps/cli/cargo-ai-cli_${target}.cdx.json:cli" \
              "apps/desktop/src-tauri/cargo-ai-desktop_${target}.cdx.json:desktop"; do
              sbom="${spec%%:*}"
              component="${spec##*:}"
              test -s "$sbom"
              jq -e . "$sbom" >/dev/null
              cp "$sbom" "release-assets/${component}_${arch}.cdx.json"
            done
          done
          cp release-commit.txt release-assets/BUILD_COMMIT
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS

      - name: Hand verified artifacts to the isolated publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-production-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/cargo-release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/cargo-release-gnupg"
          rm -f "$RUNNER_TEMP/cargo-developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cargo-release-signers.asc" "$RUNNER_TEMP/cargo-tag-verification.log"

  publish:
    name: Attest and publish verified artifacts
    needs: macos
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the fixed build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-production-release-assets
          path: release-assets

      - name: Revalidate checksums and signed-tag binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release-assets/BUILD_COMMIT
          test -s release-assets/SHA256SUMS
          shasum -a 256 -c release-assets/SHA256SUMS
          build_commit="$(cat release-assets/BUILD_COMMIT)"
          grep -Eq '^[0-9a-f]{40}$' release-assets/BUILD_COMMIT || { echo "BUILD_COMMIT is not a full lowercase commit SHA" >&2; exit 1; }
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          test "$(jq -r '.object.type' <<<"$ref_json")" = tag || { echo "production tag is no longer annotated" >&2; exit 1; }
          tag_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
          test "$(jq -r '.verification.verified' <<<"$tag_json")" = true || { echo "production tag is no longer verified" >&2; exit 1; }
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit || { echo "signed tag does not directly target a commit" >&2; exit 1; }
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$build_commit" || { echo "artifact commit does not match the signed tag" >&2; exit 1; }

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: release-assets/*

      - name: Create or recover the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_commit="$(cat release-assets/BUILD_COMMIT)"
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish >/tmp/cargo-existing-release.json 2>/dev/null; then
            test "$(jq -r '.isDraft' /tmp/cargo-existing-release.json)" = true || { echo "refusing to mutate an already-published release" >&2; exit 1; }
            commitish="$(jq -r '.targetCommitish' /tmp/cargo-existing-release.json)"
            case "$commitish" in
              "$RELEASE_TAG"|"$build_commit") ;;
              *) echo "existing draft targets a different commit" >&2; exit 1 ;;
            esac
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "Cargo ${RELEASE_TAG}" --target "$build_commit"
          fi

      - name: Verify inventory and publish draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$(find release-assets -maxdepth 1 -type f -exec basename {} \; | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$actual" = "$expected" || { echo "draft release asset inventory mismatch" >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false
